name: Deploy invitation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test invitation
        run: node --test
      - name: Prepare public files
        run: |
          mkdir -p _site/assets
          cp index.html styles.css app.js config.js lib.mjs translations.mjs _site/
          cp assets/twins.png assets/south-indian-couple.png assets/tamil-canopy.webp assets/tamil-column-left.webp assets/tamil-column-right.webp _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
